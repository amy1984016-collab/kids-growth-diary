<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f0edff"><link rel="manifest" href="manifest.webmanifest">
<title>孩子成長日記｜WHO版</title>
<style>
:root{--a:#7567d9;--bg:#faf9ff;--card:#fff;--text:#263238;--muted:#788492;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:700px;margin:auto;padding:20px 15px 35px}.title{font-size:25px;font-weight:850}.sub{font-size:13px;color:var(--muted);margin:4px 0 15px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:750;font-size:15px}.tab.active{background:#eeeafd;border-color:#cec7f5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}.muted{font-size:12px;color:var(--muted)}.big{font-size:37px;font-weight:850}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f7f8fa;border-radius:12px;padding:10px}.stat b{display:block;font-size:16px;margin-top:3px}.section{font-weight:800;margin-bottom:4px}.hint{font-size:12px;color:var(--muted);margin-bottom:8px}
form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:16px}.full{grid-column:1/-1}.save{grid-column:1/-1;border:0;border-radius:12px;padding:12px;background:#eeeafd;font-weight:800;font-size:15px;cursor:pointer}
.record{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.rdate{font-size:12px;color:var(--muted)}.rh{font-weight:800;font-size:17px}.gain{font-size:12px;color:#4c8a5a;margin-left:6px}.del{border:0;background:none;color:#a45d5d;cursor:pointer}.empty{text-align:center;padding:16px;color:var(--muted)}
svg{width:100%;height:285px;display:block}.badge{display:inline-block;background:#eeeafd;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.notice{font-size:11px;line-height:1.55;color:var(--muted)}
</style>
</head><body><main>
<div class="title">🌱 孩子成長日記</div><div class="sub">WHO 2007 成長參考 × 自己的成長軌跡</div>
<div class="tabs"><button class="tab active" data-p="恩大">👦 大哥・恩大</button><button class="tab" data-p="叡弟">👦 小弟・叡弟</button></div>
<div class="card"><div class="muted" id="age"></div><div><span class="big" id="cur">—</span> cm</div><div id="pct" class="badge">尚無量測</div>
<div class="stats"><div class="stat"><span class="muted">比上次</span><b id="gain">—</b></div><div class="stat"><span class="muted">相隔</span><b id="days">—</b></div><div class="stat"><span class="muted">紀錄</span><b id="count">0 次</b></div></div></div>
<div class="card"><div class="section">📈 WHO 身高／年齡曲線</div><div class="hint">灰階參考線＝WHO 2007；紫色點＝孩子實際量測</div><svg id="chart" viewBox="0 0 700 300"></svg></div>
<div class="card"><div class="section">＋ 新增量測</div><form id="form">
<div class="field"><label>日期</label><input id="date" type="date" required></div><div class="field"><label>身高（cm）</label><input id="height" type="number" min="50" max="220" step=".1" required></div>
<div class="field"><label>體重（kg，可不填）</label><input id="weight" type="number" min="5" max="200" step=".1"></div><div class="field"><label>備註</label><input id="note" placeholder="例如：健康檢查"></div>
<button class="save" type="submit">儲存這次紀錄 🌱</button></form></div>
<div class="card"><div class="section">📋 成長足跡</div><div id="records"></div><div id="empty" class="empty">還沒有紀錄。</div></div>
<div class="card notice">資料參考：World Health Organization (WHO) 2007 Growth Reference，5–19 歲身高／年齡。此圖表用於成長趨勢紀錄與參考，不是醫療診斷工具。</div>
</main>
<script>
const CHILD={恩大:{birth:"2013-04-18"},叡弟:{birth:"2020-02-22"}};
const WHO=[
[5,109.96,4.63],[6,115.95,4.93],[7,121.73,5.29],[8,127.27,5.65],[9,132.57,6.01],
[10,137.78,6.37],[11,143.11,6.73],[12,149.08,7.09],[13,156.04,7.43],[14,163.18,7.69],
[15,168.96,7.80],[16,172.90,7.77],[17,175.16,7.64],[18,176.14,7.47],[19,176.54,7.30]
];
let db=JSON.parse(localStorage.getItem("kidsGrowthWHO")||'{"恩大":[],"叡弟":[]}'),person="恩大";
const $=id=>document.getElementById(id);
const now=new Date();
$("date").value=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,10);

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  person=b.dataset.p;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
  render();
});

$("form").onsubmit=e=>{
  e.preventDefault();
  let d=$("date").value;
  let h=parseFloat($("height").value);
  let w=$("weight").value?parseFloat($("weight").value):null;
  let n=$("note").value.trim();

  if(!d){alert("請選擇日期！");return;}
  if(!Number.isFinite(h)||h<=0){alert("請輸入有效的身高數值！");return;}

  db[person]=db[person].filter(x=>x.date!==d);
  db[person].push({date:d,height:h,weight:w,note:n});
  db[person].sort((a,b)=>a.date.localeCompare(b.date));
  
  try{
    localStorage.setItem("kidsGrowthWHO",JSON.stringify(db));
  }catch(err){
    alert("儲存失敗：" + err.message);
    return;
  }

  $("height").value="";
  $("weight").value="";
  $("note").value="";
  render();
};

function ageMonths(b,d){let x=new Date(b),y=new Date(d);return (y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth())-(y.getDate()<x.getDate()?1:0)}
function ageText(m){return Math.floor(m/12)+"歲"+(m%12)+"個月"}
function ref(m){let age=5+m/12; if(age<=5)return WHO[0]; if(age>=19)return WHO.at(-1); let i=Math.floor(age-5),f=age-(5+i),a=WHO[i],b=WHO[i+1];return [age,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]}
function pct(z){if(z<=-2)return "約 P3 以下";if(z<=-1)return "約 P3～P16";if(z<0)return "約 P16～P50";if(z<1)return "約 P50～P84";if(z<2)return "約 P84～P97";return "約 P97 以上"}

function render(){
  let a=db[person];
  $("count").textContent=a.length+" 次";
  if(!a.length){
    $("cur").textContent="—";$("pct").textContent="尚無量測";$("gain").textContent="—";$("days").textContent="—";
    $("age").textContent="生日："+CHILD[person].birth;
    $("records").innerHTML="";$("empty").style.display="block";
    draw([]);return;
  }
  $("empty").style.display="none";
  let l=a.at(-1),p=a.at(-2),m=ageMonths(CHILD[person].birth,l.date),r=ref(m),z=(l.height-r[1])/r[2];
  $("cur").textContent=l.height.toFixed(1);
  $("age").textContent="量測時 "+ageText(m)+"　｜　出生 "+CHILD[person].birth;
  $("pct").textContent=pct(z);
  $("gain").textContent=p?((l.height-p.height>=0?"+":"")+(l.height-p.height).toFixed(1)+" cm"):"—";
  $("days").textContent=p?Math.round((new Date(l.date)-new Date(p.date))/86400000)+" 天":"—";
  
  $("records").innerHTML=a.slice().reverse().map((x,ri)=>{
    let i=a.length-1-ri,q=i?a[i-1]:null,g=q?x.height-q.height:null,mm=ageMonths(CHILD[person].birth,x.date),rr=ref(mm),zz=(x.height-rr[1])/rr[2];
    return `<div class="record"><div><div class="rdate">${x.date.replaceAll("-","/")}｜${ageText(mm)}</div><span class="rh">${x.height.toFixed(1)} cm</span>${g!==null?`<span class="gain">${g>=0?"+":""}${g.toFixed(1)} cm</span>`:""}<span class="muted">　${pct(zz)}</span>${x.note?`<div class="muted">${x.note.replace(/[&<>]/g,"")}</div>`:""}</div><button class="del" data-i="${i}">刪除</button></div>`;
  }).join("");

  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    a.splice(+b.dataset.i,1);
    localStorage.setItem("kidsGrowthWHO",JSON.stringify(db));
    render();
  });
  draw(a);
}

function draw(a){
  let s=$("chart"),W=700,H=300,p={l:45,r:18,t:18,b:38};
  s.innerHTML="";
  let ages=[];for(let x=5;x<=19;x+=.25)ages.push(x);
  let all=[];WHO.forEach(q=>[-2,-1,0,1,2].forEach(z=>all.push(q[1]+z*q[2])));
  if(a.length)all.push(...a.map(x=>x.height));
  let lo=Math.floor(Math.min(...all)-2),hi=Math.ceil(Math.max(...all)+2),
      X=x=>p.l+(x-5)/(19-5)*(W-p.l-p.r),Y=y=>H-p.b-(y-lo)/(hi-lo)*(H-p.t-p.b);
  
  for(let i=0;i<5;i++){
    let v=lo+(hi-lo)*i/4,y=Y(v);
    s.insertAdjacentHTML("beforeend",`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="#e7e9ee"/><text x="${p.l-7}" y="${y+4}" text-anchor="end" fill="#788492" font-size="10">${v}</text>`);
  }
  [-2,-1,0,1,2].forEach((z)=>{
    let d=ages.map(x=>{let r=ref(Math.round((x-5)*12));return X(x)+","+Y(r[1]+z*r[2])}).join(" ");
    s.insertAdjacentHTML("beforeend",`<polyline points="${d}" fill="none" stroke="${z===0?"#8d939a":"#c5c9ce"}" stroke-width="${z===0?2.5:1.3}" ${z===0?"":"stroke-dasharray='4 4'"} />`);
  });
  [5,7,9,11,13,15,17,19].forEach(x=>s.insertAdjacentHTML("beforeend",`<text x="${X(x)}" y="${H-12}" text-anchor="middle" fill="#788492" font-size="10">${x}歲</text>`));
  
  if(a.length){
    let d=a.map(q=>{let m=ageMonths(CHILD[person].birth,q.date);return X(5+m/12)+","+Y(q.height)}).join(" ");
    if(a.length>1)s.insertAdjacentHTML("beforeend",`<polyline points="${d}" fill="none" stroke="#7567d9" stroke-width="3.5" stroke-linecap="round"/>`);
    a.forEach(q=>{
      let m=ageMonths(CHILD[person].birth,q.date),x=X(5+m/12),y=Y(q.height);
      s.insertAdjacentHTML("beforeend",`<circle cx="${x}" cy="${y}" r="6" fill="#fff" stroke="#7567d9" stroke-width="3"><title>${q.date}｜${q.height.toFixed(1)} cm</title></circle>`);
    });
  }
}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
